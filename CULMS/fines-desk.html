<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fines Desk - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Fines Desk</h1><p class="text-white mb-0">Record patron fine payments</p></div></section><section class="container py-5 d-print-none"><div class="row g-4 mb-4"><div class="col-md-4"><div class="bg-light rounded p-4"><p>Unpaid fines</p><h2 id="total-unpaid">K0.00</h2></div></div><div class="col-md-4"><div class="bg-light rounded p-4"><p>Total collected</p><h2 id="total-collected">K0.00</h2></div></div><div class="col-md-4"><div class="bg-light rounded p-4"><p>Blocked patrons</p><h2 id="blocked-count">0</h2></div></div></div><div class="bg-light rounded p-4 mb-4"><div class="input-group"><input id="fine-patron" class="form-control" autofocus placeholder="Patron ID or email"><button id="load-patron" class="btn btn-primary">Load</button></div><div id="fine-patron-card" class="mt-3"></div><div class="table-responsive"><table class="table"><thead><tr><th><input id="select-all" type="checkbox"></th><th>Title</th><th>Amount</th></tr></thead><tbody id="fine-rows"></tbody></table></div><p id="selected-total">Selected: K0.00</p><button id="record-payment" class="btn btn-primary" disabled>Record payment</button></div><h3>Patrons with unpaid fines</h3><div class="table-responsive mb-4"><table class="table"><tbody id="unpaid-patrons"></tbody></table></div><h3>Previous receipts</h3><div class="table-responsive"><table class="table"><tbody id="receipt-rows"></tbody></table></div><div class="modal fade" id="payment-modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Confirm payment</h5></div><div class="modal-body"><p id="payment-message"></p></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button id="confirm-payment" class="btn btn-primary">Record payment</button></div></div></div></div></section><section id="receipt" class="container py-5 d-none d-print-block"></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/finesDesk.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
