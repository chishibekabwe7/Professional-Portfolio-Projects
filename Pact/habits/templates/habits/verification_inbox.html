{% extends "habits/layout.html" %}
{% load static %}

{% block title %}Verification Inbox | Pact{% endblock %}

{% block extra_js %}
  <script defer src="{% static 'habits/inbox.js' %}"></script>
{% endblock %}

{% block content %}
<div class="row g-4">
  <div class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    <div>
      <h1 class="h3 mb-1">Verification Inbox</h1>
      <p class="text-muted mb-0">Pending check-ins waiting for your review.</p>
    </div>
  </div>

  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-body">
        <div id="verification-inbox" class="verification-inbox" data-api-url="{% url 'verification_inbox_api' %}" data-respond-template="{% url 'respond_to_checkin_api' 0 %}">
          <div class="text-muted">Loading pending check-ins...</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
