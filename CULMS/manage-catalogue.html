<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Catalogue - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Manage Catalogue</h1><p class="text-white mb-0">Maintain books and physical copies</p></div></section><section class="container py-5 d-print-none"><div class="d-flex justify-content-between mb-3"><div class="input-group w-50"><input id="catalogue-query" class="form-control" placeholder="Search title, author or ISBN"><button id="catalogue-search" class="btn btn-primary">Search</button></div><button id="add-book" class="btn btn-primary">Add book</button></div><div class="row g-3 mb-3"><div class="col-md-6"><select id="catalogue-category" class="form-select"><option value="">All categories</option></select></div><div class="col-md-6"><select id="catalogue-campus" class="form-select"><option value="">All campuses</option></select></div></div><p id="catalogue-count"></p><div class="table-responsive"><table class="table table-bordered"><thead class="bg-primary text-white"><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Total</th><th>Available</th><th>On loan</th><th>Actions</th></tr></thead><tbody id="catalogue-rows"></tbody></table></div><nav><ul id="catalogue-pagination" class="pagination"></ul></nav></section><div class="modal fade" id="edit-book-modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Edit book</h5></div><div class="modal-body"><input id="edit-isbn" class="form-control mb-2" readonly><input id="edit-title" class="form-control mb-2"><input id="edit-author" class="form-control mb-2"><input id="edit-category" class="form-control"></div><div class="modal-footer"><button id="save-book" class="btn btn-primary">Save</button></div></div></div></div><div class="modal fade" id="add-book-modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Add book</h5></div><div class="modal-body"><input id="new-isbn" class="form-control mb-2" placeholder="ISBN"><input id="new-title" class="form-control mb-2" placeholder="Title"><input id="new-author" class="form-control mb-2" placeholder="Author"><input id="new-category" list="category-list" class="form-control mb-2" placeholder="Category"><datalist id="category-list"></datalist><div id="initial-copies"></div><button id="add-copy-row" class="btn btn-secondary btn-sm">Add copy</button></div><div class="modal-footer"><button id="save-new-book" class="btn btn-primary">Save</button></div></div></div></div><div class="modal fade" id="delete-book-modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Delete book</h5></div><div class="modal-body"><p id="delete-book-message"></p></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button id="confirm-delete-book" class="btn btn-danger">Delete</button></div></div></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/manageCatalogue.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
