<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Checkout</h1><p class="text-white mb-0">Circulation desk checkout</p></div></section><section class="container py-5"><div id="permission-alert"></div><div class="row g-4"><div class="col-lg-6"><div class="bg-light rounded p-4"><h3>Step 1: Patron</h3><div class="input-group"><input id="patron-input" class="form-control" autofocus placeholder="Patron ID or email"><button id="find-patron" class="btn btn-primary">Find</button></div><div id="patron-card" class="mt-4"></div></div></div><div class="col-lg-6"><div class="bg-light rounded p-4"><h3>Step 2: Copy</h3><input id="copy-input" class="form-control" placeholder="Copy barcode"><div id="copy-card" class="mt-4"></div><button id="confirm-checkout" class="btn btn-primary mt-3" disabled>Confirm checkout</button></div></div></div><div id="checkout-result" class="row g-4 mt-1"></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/checkout.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
