<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course Reserve - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Course Reserve</h1><p class="text-white mb-0">Place required readings for your course</p></div></section><section class="container py-5"><div class="row g-4"><div class="col-lg-6"><div class="bg-light rounded p-4"><h3>Place a book</h3><input id="reserve-search" class="form-control mb-3" placeholder="Search title, author or ISBN"><div id="reserve-results"></div><select id="reserve-copy" class="form-select mb-3"><option value="">Select an available copy</option></select><input id="course-code" class="form-control mb-3" placeholder="Course code, for example IS-230"><p class="small">Course reserve loans last <span id="reserve-days"></span> days and cannot be renewed.</p><button id="place-reserve" class="btn btn-primary">Place on course reserve</button></div></div><div class="col-lg-6"><div class="section-title position-relative pb-3 mb-3"><h2>My course reserve items</h2></div><div class="table-responsive"><table class="table table-bordered"><thead class="bg-primary text-white"><tr><th>Title</th><th>Code</th><th>Barcode</th><th>Campus</th><th>Status</th><th>Placed</th><th>Borrowed</th><th></th></tr></thead><tbody id="reserve-rows"></tbody></table></div></div></div></section></main><div class="modal fade" id="remove-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Remove course reserve</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Remove this copy from your course reserve?</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Keep</button><button id="confirm-remove" class="btn btn-primary">Remove</button></div></div></div></div><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/courseReserve.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
