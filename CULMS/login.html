<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Demo login</h1><p class="text-white mb-0">Client-side demonstration access</p></div></section><section class="container py-5"><div class="alert alert-info">This is a client-side demo login. All data and credentials stay in this browser. The default password for every seeded account is <strong>culms-demo</strong>. A real deployment would require a secure server.</div><form id="login-form" class="row g-3"><div class="col-12"><label class="form-label" for="identifier">ID or email</label><input id="identifier" class="form-control" required></div><div class="col-12"><label class="form-label" for="password">Password</label><div class="input-group"><input id="password" class="form-control" type="password" required><button id="toggle-password" class="btn btn-outline-secondary" type="button">Show</button></div></div><div class="col-12"><div id="login-error" class="alert alert-danger d-none"></div><button class="btn btn-primary" type="submit">Sign in</button> <a href="#" id="reset" class="btn btn-link">Reset demo data</a></div></form><div class="accordion mt-5" id="demo-accordion"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#demo-list" type="button">Demo accounts</button></h2><div id="demo-list" class="accordion-collapse collapse"><div id="demo-accounts" class="accordion-body"></div></div></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/login.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
