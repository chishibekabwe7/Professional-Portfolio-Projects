<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My History - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">My History</h1><p class="text-white mb-0">Review your borrowing history</p></div></section><section class="container py-5"><div class="row align-items-end g-3 mb-4"><div class="col-md-4"><label class="form-label" for="history-filter">Filter</label><select id="history-filter" class="form-select"><option>All</option><option>Active</option><option>Overdue</option><option>Returned</option><option>Returned late</option></select></div><div class="col-md-8 text-md-end"><span id="history-count" class="text-muted"></span></div></div><div class="table-responsive"><table class="table table-bordered"><thead class="bg-primary text-white"><tr><th>Title</th><th>Campus</th><th>Issue</th><th>Due</th><th>Returned</th><th>Status</th><th>Renewed</th><th>Fine</th></tr></thead><tbody id="history-rows"></tbody></table></div><nav><ul id="history-pagination" class="pagination justify-content-center"></ul></nav></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/myHistory.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
