<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Demo login</h1><p class="text-white mb-0">Sign in to the CULMS demonstration</p></div></section><section class="container py-5"><div class="alert alert-info">This is a demo login. There are no passwords, and all data stays in this browser.</div><form id="login-form" class="row g-3"><div class="col-md-6"><label class="form-label" for="role">Role</label><select id="role" class="form-control" required><option>Student</option><option>Professor</option><option>Librarian</option><option>Administrator</option></select></div><div class="col-md-6"><label class="form-label" for="account">Account</label><select id="account" class="form-control" required></select></div><div class="col-12"><button class="btn btn-primary" type="submit">Sign in</button> <a href="#" id="reset" class="btn btn-link">Reset demo data</a></div><div id="error" class="text-danger"></div></form></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module">import {{ culms, setSession }} from './js/presentation/app.js'; import {{ currentUser }} from './js/presentation/guard.js'; import {{ safeNextUrl }} from './js/business/access.js'; const existing=currentUser(); if(existing) location.href=safeNextUrl(new URLSearchParams(location.search).get('next'), existing); const role=document.querySelector('#role'), account=document.querySelector('#account'); function fill() {{ account.innerHTML=culms.auth.listDemoAccounts().filter(a=>a.role===role.value).map(a=>`<option value="${{a.id}}">${{a.name}} (${{a.campus}})</option>`).join(''); }} role.addEventListener('change',fill); fill(); document.querySelector('#login-form').addEventListener('submit', e=>{{e.preventDefault(); const result=culms.auth.login(account.value,role.value); if(result.ok) {{setSession(result.data); location.href=safeNextUrl(new URLSearchParams(location.search).get('next'),result.data);}} else document.querySelector('#error').textContent=result.error.message;}}); document.querySelector('#reset').addEventListener('click', e=>{{e.preventDefault(); if(confirm('Reset all demo data?')) {{culms.resetDemoData(); location.reload();}}}});</script><script type="module" src="js/presentation/layout.js"></script></body></html>
