<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acquisitions - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Acquisition Requests</h1><p class="text-white mb-0">Request resources for teaching and research</p></div></section><section class="container py-5"><div class="bg-light rounded p-4 mb-5"><form id="acquisition-form" class="row g-3"><div class="col-md-6"><label class="form-label">Title</label><input id="acq-title" class="form-control" required></div><div class="col-md-6"><label class="form-label">Author</label><input id="acq-author" class="form-control" required></div><div class="col-md-6"><label class="form-label">ISBN optional</label><input id="acq-isbn" class="form-control"></div><div class="col-md-6"><label class="form-label">Estimated cost in K optional</label><input id="acq-cost" class="form-control" type="number" min="0" step="0.01"></div><div class="col-12"><label class="form-label">Justification</label><textarea id="acq-justification" class="form-control" rows="3" required></textarea></div><div class="col-12"><button class="btn btn-primary" type="submit">Submit request</button></div></form></div><div class="table-responsive"><table class="table table-bordered"><thead class="bg-primary text-white"><tr><th>Title</th><th>Author</th><th>Cost</th><th>Status</th><th>Date</th></tr></thead><tbody id="acq-rows"></tbody></table></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/acquisitions.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
