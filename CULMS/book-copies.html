<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Copies - CULMS</title><link href="css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main class="d-none"><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Book Copies</h1><p class="text-white mb-0">Manage physical copies</p></div></section><section class="container py-5 d-print-none"><a href="manage-catalogue.html">Back to catalogue</a><div id="book-alert" class="mt-3"></div><h2 id="book-title" class="my-3"></h2><div class="table-responsive"><table class="table table-bordered"><thead class="bg-primary text-white"><tr><th>Barcode</th><th>Campus</th><th>Shelf</th><th>Condition</th><th>Status</th><th>Course reserve</th><th>Actions</th></tr></thead><tbody id="copy-rows"></tbody></table></div><div class="bg-light rounded p-4"><h4>Add copy</h4><div class="row g-2"><select id="copy-campus" class="form-select col"><option>Select campus</option></select><input id="copy-shelf" class="form-control col" placeholder="Shelf location"><select id="copy-condition" class="form-select col"><option>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option><button id="save-copy" class="btn btn-primary col">Add copy</button></div></div></section><div class="modal fade" id="edit-copy-modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Edit copy</h5></div><div class="modal-body"><input id="edit-copy-barcode" class="form-control mb-2" readonly><select id="edit-copy-campus" class="form-select mb-2"></select><input id="edit-copy-shelf" class="form-control mb-2"><select id="edit-copy-condition" class="form-select"><option>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option></select></div><div class="modal-footer"><button id="save-ed
