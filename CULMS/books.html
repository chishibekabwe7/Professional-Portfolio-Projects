<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Catalogue - CULMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="site-header"></div><main><section class="page-header bg-primary py-5"><div class="container py-5 text-center"><h1 class="display-4 text-white">Library Catalogue</h1><p class="text-white mb-0">Search books across the CBU library campuses</p></div></section><section class="container py-5"><form id="search-form" class="row g-3 align-items-end"><div class="col-lg-4"><label class="form-label" for="query">Search</label><input id="query" class="form-control" type="search" placeholder="Title, author or ISBN"></div><div class="col-md-6 col-lg-2"><label class="form-label" for="campus">Campus</label><select id="campus" class="form-select"></select></div><div class="col-md-6 col-lg-2"><label class="form-label" for="category">Category</label><select id="category" class="form-select"></select></div><div class="col-md-6 col-lg-2"><label class="form-label" for="sortBy">Sort</label><select id="sortBy" class="form-select"><option value="title">Title</option><option value="author">Author</option><option value="availability">Availability</option></select></div><div class="col-md-6 col-lg-1"><div class="form-check"><input id="availableOnly" class="form-check-input" type="checkbox"><label class="form-check-label" for="availableOnly">Available</label></div></div><div class="col-lg-1"><button class="btn btn-primary w-100" type="submit">Search</button></div></form><div class="d-flex justify-content-between align-items-center mt-5 mb-3"><h2 class="mb-0">Books</h2><span id="result-count" class="text-muted"></span></div><div id="results" class="row g-4"></div><nav class="mt-5" aria-label="Catalogue pages"><ul id="pagination" class="pagination justify-content-center"></ul></nav></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/presentation/pages/books.js"></script><script type="module" src="js/presentation/layout.js"></script></body></html>
